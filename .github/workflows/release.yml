name: Release

# Os artefactos (para o utilizador NÃO precisar de Rust/Android SDK):
# - flowtools-pc_<ver>_amd64.deb + flowtools-server_<ver>_amd64.deb
# - app-release.apk (assinado, se os secrets existirem) + app-release.aab
# Publicados na GitHub Release da tag. Criar release: `git tag v1.0.0 && git push origin v1.0.0`
#
# Secrets necessários para APK/AAB assinados (ver README):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  debs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libs (enigo/xcap/pipewire)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libssl-dev clang \
            libwayland-dev libxkbcommon-dev libx11-dev libxtst-dev \
            libpipewire-0.3-dev libegl-dev libgl-dev libgbm-dev libdrm-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Build .debs
        run: |
          cargo deb -p flowtools-pc
          cargo deb -p flowtools-server
          dpkg-deb -c target/debian/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: debs
          path: target/debian/*.deb

  android-signed:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      # Os runners ubuntu-24.04 já trazem Android SDK pré-instalado
      # (o action setup-android@v3 está partido: tenta instalar "tools").
      - name: SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Restore keystore (se existir secret)
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.jks
            cat > key.properties <<EOF
          storeFile=$PWD/release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
            echo "keystore restaurado"
          else
            echo "sem secret de keystore — release sem assinatura"
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Release APK + AAB
        run: gradle :app:assembleRelease :app:bundleRelease
      - name: Verify signature
        run: |
          [ -f app/build/outputs/apk/release/app-release.apk ] || { echo "sem APK release"; exit 1; }
          APK=app/build/outputs/apk/release/app-release.apk
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            apksigner verify --print-certs "$APK" | head -n 3
          else
            echo "ATENCAO: sem secrets de assinatura — APK release NAO assinado (instala o debug)."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab

  publish:
    needs: [debs, android-signed]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
