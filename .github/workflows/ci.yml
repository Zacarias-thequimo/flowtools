name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libs (enigo/xcap/pipewire)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libssl-dev clang \
            libwayland-dev libxkbcommon-dev libx11-dev libxtst-dev \
            libpipewire-0.3-dev libegl-dev libgl-dev libgbm-dev libdrm-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: test
        run: cargo test --workspace

  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      # Os runners ubuntu-24.04 já trazem Android SDK pré-instalado
      # (o action setup-android@v3 está partido: tenta instalar "tools").
      - name: SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Unit tests
        run: gradle :app:testDebugUnitTest
      - name: Debug APK
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
